default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: upgrade_advisor_development

test:
  <<: *default
  database: upgrade_advisor_test

production:
  <<: *default
  database: upgrade_advisor_production
  username: upgrade_advisor
  password: <%= ENV["UPGRADE_ADVISOR_DATABASE_PASSWORD"] %>
