      string: '{"model":"nomic-embed-text:v1.5","input":"search_document: Story\nThe
        Maestro and the Patron\n\nFilippo dipped his brush and began to paint. He
        was adding the finishing touches to the Maestro’s largest work yet. The huge
        canvas was exquisite. It depicted a view of the city, celebrating its intricate
        streets, grand architecture and mighty walls.\nAround the studio, assistants
        were busy working on the Maestro’s other commissions. The Maestro painted
        the most important sections himself, but backgrounds and secondary figures
        were delegated to assistants like Filippo.\nOnce Filippo began to paint, his
        brush flowed almost with a life of its own. He was the Maestro’s most trusted
        assistant, but the Maestro also feared him. Filippo’s skill was exceptional,
        and his own creative ideas were brilliant. The Maestro worked hard to keep
        Filippo in his place.\n“Truly a masterpiece,” said a voice behind Filippo.\nFilippo
        hadn’t noticed: the Maestro’s patron had made a surprise visit to inspect
        the work. The patron was standing behind him, watching, with the Maestro by
        his side.\n“Everyone who sees it in the Council Chamber will be awed.”\n“Indeed,”
        said the Maestro. “Every nobleman in the city will hear of your civic pride,
        wealth and generosity.”\n“But what is this?” the patron said, pointing to
        the background that Filippo had painted.\n“That shows the landscape beyond
        the city,” said Filippo. “The hills and forests in this area are truly beautiful.”\n“I
        asked for a painting to celebrate the city, not the grass!”\nThe Maestro looked
        at Filippo angrily. “I told you to paint the city walls there,” he said sternly.\nThen
        the patron gasped. “Who are these figures?”\nHe was pointing to the people
        in the streets in the foreground. Filippo had added peasants, poor children
        and beggars.\n“Those are the real people who live in the city,” said Filippo.
        “Without those people, the city couldn’t exist.”\n“Are you mad?” the patron
        asked the Maestro. “We can’t display beggars in the Council Chamber!”\n“I
        assure you, sir, these were not my instructions,” said the Maestro quickly.
        “I will personally change those figures for noblemen this afternoon.”\nAfter
        the patron had left, the Maestro screamed at Filippo for ten minutes. Filippo
        argued back. He believed passionately that the city’s greatness and beauty
        included both rich and poor, both architecture and landscape.\nAt last, the
        Maestro shouted: “Get your things, leave my studio, and never return.”\nFilippo
        carried everything he owned in a small satchel. He wandered the same streets
        that he had been painting. He greeted the peasants, gave bread to the children,
        and gave his last coins to a beggar. At last he sat down in the market square
        and wept.\nHis career as an artist was over. No other maestro would accept
        him now.\nHe pulled a sheet of rough paper from his satchel, and a stick of
        charcoal. He began to sketch furiously. He captured the market stalls, the
        traders and the peasants; the muddy streets and the detritus; and the shadow
        of the palace. Soon, he forgot about his misery and was absorbed in the work.\n“I
        have never seen art with such honesty,” said a voice behind him. It was a
        nobleman who had stopped to watch.\nFilippo stood up to show respect. The
        nobleman asked which studio Filippo worked for. Filippo explained.\n“Then
        I shall provide you with a space, assistants and all the materials you need.
        Make a painting from your sketch, and I’ll donate it to the new hospital.
        Every patient, rich or poor, will see it.”\n“But that will cost —”\n“It will
        be worth it. There are thousands of paintings throughout this city, but very
        little art. You should see the rubbish they display in the Council Chamber.”\n\nStory\nA
        Brilliant Script\n\nDominic turns on the lamp and sits down. He drinks his
        coffee. Finally, he has an idea.\nHe starts typing on his laptop. He is writing
        a script for a film.\n“Everything is silent,” he writes. “The security guard
        is sleeping. The secret letters are on the desk. The spy moves closer. Quietly,
        she —”\nBang! Dominic jumps. The coffee spills on the laptop. The laptop stops
        working. The screen says: “Error!”\nThere are green and yellow lights outside
        the window. People are clapping. Dominic’s neighbour is having a party. She
        is a famous film director. Bang! Another firework explodes in the director’s
        garden.\nIn the bin, beside Dominic’s desk, there is a letter. It says: “Please
        come to my party. We’re celebrating my new film, ‘Sorry, Mr Spy’. Your script
        is about a spy too, isn’t it? Please tell me about it!”\nDominic closes the
        curtains. He cleans the laptop. He turns it off, then he turns it on again.
        It’s working.\nHe starts a new script.\n“The film director is having a party,”
        he writes. “Her new film, ‘The Apology’, is very popular. In the middle of
        the party, her neighbour arrives.\n“He’s angry. ‘Your films are rubbish,’
        he says. ‘Popular, but rubbish. I’m writing a script that is brilliant. But
        I can’t finish it, because you’re making so much noise!’\n“The next day, the
        director comes to apologise. She wants to read his script. But he closes the
        door. Finally, the director of ‘The Apology’ feels sorry. The End.”\nDominic
        smiles. Then he clicks Delete.\nThe next day, someone knocks on Dominic’s
        door. It’s the director.\n“Your new script is fantastic!” she says.\n“What?”\n“The
        director who feels sorry! I love it.”\nDominic runs to his laptop. His script
        is still there. The laptop is emailing the script to everyone in his contacts.
        The screen still says: “Error!”\n“But I —”\n“What a brilliant idea, Dominic,
        to make the film here, in my garden! Everyone’s ready – we’re starting today.
        I know, we work too hard – but we have a lot of parties too! Dominic? Are
        you alright?”\n\nStory\nA Table for Three\n\nThe chef placed the plates on
        the counter. The steak was perfect. The vegetables were fresh and tender.
        The smell of the sauce was mouth-watering. Henry picked the plates up and
        carried them gracefully into the dining room.\nThere was only one table in
        the lavishly decorated room. In the corner, a woman was playing soft piano
        music. The walls were made of glass, and the view of the sea was magnificent.\nHenry
        placed one plate in front of each of the three men, and began to pour the
        wine.\n“So, she’s been elected,” said one man with brown hair. “But without
        my support, she’s nothing.”\nA bald man spoke. “That’s seventeen governments
        you control now, isn’t it? You sneaky devil!”\n“I beg your pardon!” the man
        replied, offended. “It’s eighteen.”\n“You’re catching up with me.”\nThe men
        clinked their glasses.\nHenry bowed, left the room and returned to the kitchen.
        He washed his hands, and went to the bathroom. Inside a cubicle, he checked
        his hidden camera. The device was still working correctly.\nHenry was an undercover
        reporter. For over five years, he had pretended to be a waiter. He’d worked
        at ten different catering companies. It was all so he could serve dinner to
        the three men this evening.\nEveryone who worked for the company had a strict
        contract. If they revealed anything they heard, the penalty was extremely
        harsh. But Henry didn’t care: it was more important to show the world the
        truth.\nHe washed his hands again, returned to the kitchen, and helped to
        prepare the dessert. It was a luxurious tart, made with rare dark chocolate
        and decorated with gold.\nWhen Henry brought the dessert into the dining room,
        the three men were laughing.\n“I don’t care whether the President believes
        in climate change,” said a man with curly hair. “I have secret underground
        homes on every continent. She can burn with everyone else.”\n“Underground?”
        laughed the man with brown hair. “Enjoy your life as a mole. I’ll wave to
        you from orbit.”\nThe third man scoffed. “Space? I’m staying right here on
        Earth. If it’s hot, I’ve got air conditioning. If it’s cold, I’ve got heating.
        If there’s something I need, I’ve got an army of robots.”\nHenry looked at
        the chocolate tarts. He felt sick. He placed one in front of each man, and
        poured more wine.\n“You know, I feel bad for them sometimes,” said the bald
        man. “Billions of people, working so hard, for so little. Like our waiter.”\nHenry
        froze.\n“Look at this man. Do you realise he’s worked for five years just
        to be here tonight?”\n\nStory\nProject: Control\n\n“This quarterly report
        is… unsatisfactory,” droned Nicole’s manager. “There isn’t enough detail.
        And there are too many numbers on the chart. The font should be bigger. The
        tables should use our brand colours. And you should duplicate everything at
        the end.”\n“Duplicate it, sir?”\n“One copy for me, and another for the Head
        of Department.”\n“But… I don’t need to duplicate everything. You could just
        print the document twice, sir.”\n“We don’t pay you to have clever ideas, Nicole.
        We pay you to follow instructions.”\n“I’m sorry, sir,” she mumbled.\n“What
        was that? I can’t hear you.”\n“Sir, I’ve tried so hard. I worked late, and
        at weekends.”\n“That’s irrelevant. At this company, we cannot tolerate poor
        performance. If you aren’t meeting our standards, then your pay should be
        lowered. Don’t you agree?”\n“Yes, sir.”\nNicole walked back to her desk –
        down six flights of stairs, along five corridors, and into a large room lit
        by fluorescent tube lights. There were windows, but they were very small and
        high up, so she couldn’t see outside.\nShe gulped down some coffee. She was
        so exhausted, it didn’t seem to have any effect. Over the last few months,
        her manager had given her more and more work. She’d prepared so many reports,
        sometimes she forgot what they were about, halfway through.\nShe hated the
        job, but the salary was good, and she didn’t know what else she would do.
        Other companies would probably be even worse. If she worked hard here, maybe
        she’d eventually be promoted.\nHer phone vibrated. There was a message.\n“DO
        NOT IGNORE. You don’t know me but I know you. You have been brainwashed, Nicole.
        You don’t really want to work for them. Don’t believe me? Look in the folder
        called ‘Project: Control’. The password is ‘Obedience’.”\nAt first, Nicole
        wasn’t sure what to do. But she searched for the folder on the company network,
        and found it. She entered the password, and to her surprise, the folder opened.\nInside
        there were hundreds of files, each with a different employee’s name. When
        Nicole found a file with her name, she took a sharp breath. She opened the
        file.\n“The subject is a thirty-year-old female. Ten milligrams of the drug
        have been added to her coffee daily for three years. The subject is less creative,
        more compliant and is accepting more and more work without complaint. Recommendation:
        increase dosage.”\nNicole spat out the coffee. Another message arrived.\n“They
        make the drug on Level B-Six. The code is four two seven eight. There is a
        bomb under your desk. Take it to the laboratory. There are two buttons; press
        them at the same time, and hold down for five seconds. Then you’ll have ten
        minutes. You can do it. Everyone’s counting on you.”\nWith trembling hands,
        Nicole felt under her desk. There was something heavy near the back, hidden
        among the power cables. She looked around. Everyone else was typing quickly,
        staring at their screens without blinking.\nShe picked up the device. It was
        very complicated, with microchips and tangled wires surrounding three red
        tubes.\nThis wasn’t a joke. The files were real. The bomb was real.\nNicole
        couldn’t believe herself. She wasn’t scared. For the first time in years,
        she felt in control. She felt like she cared about something. She was going
        to do it.\n“Nicole!” shouted her manager.\nNicole raised her head. She had
        fallen asleep on the manager’s desk, in his office. She stood up, feeling
        confused. She rubbed her eyes and straightened her jacket.\n“I have been very
        lenient with you Nicole, despite your unprofessional attitude, half-hearted
        effort and continual disregard for this organisation’s hierarchy!” the manager
        seethed. “But this is too much! You’re fired!”\nA few tears shone on Nicole’s
        cheeks. “Oh…” she said, smiling. “Thank you, sir!”\n","truncate":false}'
